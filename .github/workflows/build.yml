name: build

# A server binary per branch for the owners' test instances, built on their
# own self-hosted runner. Only pushes to branches of this repository reach it
# (and a manual run, which needs write access); pull requests never do, so
# code from a fork can't run on that machine. Tests run in ci.yml on GitHub's
# runners.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # a fork's copy of this workflow has no such runner; skip instead of queueing
    if: github.repository == 'Greengrame/greengram-server' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # the runner's label is a repository variable (Settings > Variables)
    runs-on: [self-hosted, "${{ vars.BUILD_RUNNER_LABEL || 'greengram-build' }}"]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false # the runner keeps its own go cache
      - run: go build -trimpath -o out/ ./cmd/greengram-server ./cmd/ggminiapps ./cmd/ggcollectibles
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: greengram-server
          path: out/
          retention-days: 5
