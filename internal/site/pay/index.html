<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Buy Stars</title>
<link rel="icon" href="/branding/logo">
<link rel="stylesheet" href="/__greengram/pay/pay.css">
<script type="module" src="/__greengram/pay/pay.js"></script>
</head>
<body>
<main>
  <div class="card item">
    <img class="mark" src="/branding/logo" alt="" width="64" height="64">
    <div class="about">
      <h1 id="title">Loading…</h1>
      <p class="tag" id="tag">Paid from your wallet</p>
      <p class="seller">Greengram · <span id="host"></span></p>
    </div>
  </div>

  <section id="pick" hidden>
    <div class="card">
      <h2>Pay with</h2>
      <div class="rows" id="assets" role="radiogroup" aria-label="Pay with"></div>
    </div>

    <div class="card">
      <div class="detail">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        <div><b>Wallet</b><span>Payment method</span></div>
      </div>
      <div class="detail">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4H4v2h16V4zm1 10v-2l-1-5H4l-1 5v2h1v6h10v-6h4v6h2v-6h1zm-9 4H6v-4h6v4z"/></svg>
        <div><b>Greengram</b><span>Payment provider</span></div>
      </div>
    </div>

    <div class="card sum">
      <div class="line"><span id="sum-stars">Stars</span><span id="sum-price">–</span></div>
      <div class="line total"><span>Total</span><span id="sum-total">–</span></div>
    </div>

    <p class="note">The app asks you to confirm next. Nothing leaves your wallet until you tap Pay there.</p>

    <div class="actions">
      <button class="btn" id="use" type="button" disabled>Continue</button>
    </div>
  </section>

  <p class="status" id="status" role="status"></p>
</main>
</body>
</html>
